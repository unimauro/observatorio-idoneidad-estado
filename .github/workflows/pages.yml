name: Deploy site to GitHub Pages
# Publica web/ a la rama gh-pages vía git (peaceiris), NO usa la API deploy-pages
# (que tuvo un incidente 401). Pages sirve desde la rama gh-pages (build_type=legacy).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
