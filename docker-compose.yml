services:
  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/idoneidad_local
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
  api:
    build: .
    command: uvicorn observatorio.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DUCKDB_PATH: /app/data/processed/observatorio.duckdb
      NEO4J_URI: bolt://neo4j:7687
    volumes: ["./:/app"]
    ports: ["8000:8000"]
    depends_on: [neo4j]
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    volumes: ["./:/app"]
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  neo4j_data:
