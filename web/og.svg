<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d91023"/>
  <rect x="0" y="622" width="1200" height="8" fill="#d91023"/>

  <!-- Institución + check -->
  <g transform="translate(96,150)">
    <path d="M0 120 L80 60 L160 120 Z" fill="#3b82f6"/>
    <rect x="8" y="124" width="14" height="96" fill="#e2e8f0"/>
    <rect x="44" y="124" width="14" height="96" fill="#e2e8f0"/>
    <rect x="80" y="124" width="14" height="96" fill="#e2e8f0"/>
    <rect x="116" y="124" width="14" height="96" fill="#e2e8f0"/>
    <rect x="0" y="226" width="160" height="18" rx="4" fill="#3b82f6"/>
