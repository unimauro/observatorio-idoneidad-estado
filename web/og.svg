  <text x="330" y="506" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Borrador en validación · correlación ≠ causalidad · sin perfilar por ideología</text>
  <text x="330" y="544" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">Desarrollado por Carlos Cárdenas Fernández</text>
