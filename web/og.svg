    <path d="M129 210 l15 15 L176 196" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto -->
  <text x="330" y="150" fill="#7dd3fc" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">OBSERVATORIO · PERÚ 🇵🇪</text>
  <text x="330" y="228" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Idoneidad y Capacidad</text>
  <text x="330" y="296" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">del Estado peruano</text>
  <text x="330" y="350" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Mérito · estabilidad · capacidad · redes · datos públicos</text>

  <!-- Chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="330" y="386" width="200" height="48" rx="24" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="430" y="418" fill="#e2e8f0" text-anchor="middle">Índice ICE</text>
    <rect x="544" y="386" width="240" height="48" rx="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
